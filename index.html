.pin .tip .av{margin:0}
.pickup{position:absolute;left:680px;top:1150px;width:80px;height:80px;margin:-80px 0 0 -40px;z-index:4;animation:drop 6s infinite}
.pickup .tp{position:relative;width:80px;height:80px;background:#1a73e8;border:6px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.pickup .tp::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;background:#fff;border-radius:50%}
